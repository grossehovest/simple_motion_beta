<style>

*{box-sizing:border-box}

button{background:transparent;border:1px solid var(--line);padding:6px 9px;cursor:pointer;margin:0 4px 4px 0}
button:hover{border-color:var(--fg)}
button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.big{width:100%;margin:12px 0 0;padding:11px;background:var(--fg);color:var(--bg);font-weight:600;border-color:var(--fg)}

textarea,input[type=text],input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);padding:6px 8px}

.row{display:grid;grid-template-columns:84px 1fr 64px;gap:6px;align-items:center;padding:2px 0}

"use strict";
const $=s=>document.querySelector(s),cl=(v,a,b)=>Math.min(b,Math.max(a,v)),lp=(a,b,t)=>a+(b-a)*t;

const DEF=[['beats','Beats',2,48,1,6],['loop','Loop (s)',1,60,.5,4],['amp','Intensity',0,1,.01,.8],['slices','Slices',3,300,1,14],['stagger','Offset',0,1,.01,.35],['speed','Speed',.1,10,.05,1],['fade','Fade (s)',0,3,.1,0],['ret','Return',0,1,.01,1],['mx','Margin X (%)',0,49,1,5],['my','Margin Y (%)',0,40,1,10],['ah','Height (%)',2,100,1,74]];
const P={},inp={},RE={clips:[],starts:[],sel:0,on:false,cur:-1,len:12,rt:0};
const MODES=['Stretch','Slice','Collapse','Waves','Rotate','Ticker','Tunnel','Radial','Mosaic','Tracking','Drop','Boxes','Textgrid','Trackwave'];
const DESC=['Column widths and heights jump on the beat.','Horizontal strips shift sideways (Slices = strips).','Letters collapse in steps and grow back.','Vertical strips run through the word as a sine wave.','Each cell rotates in quarter turns on the beat.','The word runs through counter-moving bands (Slices = bands).','The word zooms into itself, colors alternate per layer.','Letters orbit as a ring, offset on the beat.','The word breaks into tiles that swap places.','Letter spacing opens and closes (negative and wide tracking).','Letters fall, bounce and return (Intensity = tilt).','The word in boxes that split and shift on the beat (Intensity = depth).','Grid of small words; rows slide against each other and lock in.','Every letter opens and closes its own spacing, staggered by Offset.'];
const FONTS=[['Archivo Black','400'],['Anton','400'],['Bebas Neue','400'],['Bungee','400'],['Unbounded','900'],['Syne','800'],['Space Grotesk','700'],['Playfair Display','900'],['DM Serif Display','400'],['Rubik Mono One','400'],['Space Mono','700'],['Alfa Slab One','400'],['Abril Fatface','400'],['Staatliches','400'],['Dela Gothic One','400'],['Big Shoulders Display','900'],['Bricolage Grotesque','800'],['Fraunces','900'],['Inter','900'],['Rubik','900'],['Bowlby One','400'],['Londrina Solid','900'],['Chivo','900']];
const HL=()=>$('#hl').checked,IO=()=>true;
const IMV=()=>({im:S.im,pc:+$('#pc').value,pf:+$('#pf').value,px:+$('#px').value||0,pd:+$('#pd').value||0,fm:+$('#fm').value});
const setIMV=c=>{S.im=c.im|0;$('#imm').value=S.im;$('#pc').value=c.pc??4;$('#pf').value=c.pf??120;$('#px').value=c.px??0;$('#pd').value=c.pd??.05;$('#fm').value=c.fm??0};
const link=(a,b,cb)=>{a.oninput=()=>{b.value=a.value;cb&&cb()};b.oninput=()=>{if(b.value!==''&&!isNaN(b.value)){a.value=b.value;cb&&cb()}}};
const sm=(a,b,x)=>{const t=cl((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const fm=(v,st)=>(+v).toFixed((String(st).split('.')[1]||'').length);
const cv=$('#cv'),ctx=cv.getContext('2d');
// Pixel snap: destination rects of drawImage/clip are rounded to whole device pixels -> no seams between strips
const _di=ctx.drawImage.bind(ctx),_rc=ctx.rect.bind(ctx);
const snapR=(x,y,w,h)=>{const t=ctx.getTransform();if(!$('#sp').checked||t.b||t.c||!t.a||!t.d)return null;const X0=Math.round(t.a*x+t.e),X1=Math.round(t.a*(x+w)+t.e),Y0=Math.round(t.d*y+t.f),Y1=Math.round(t.d*(y+h)+t.f);return[(X0-t.e)/t.a,(Y0-t.f)/t.d,(X1-X0)/t.a,(Y1-Y0)/t.d]};
ctx.drawImage=(im,...a)=>{const o=a.length===8?4:0,r=a.length>=4?snapR(a[o],a[o+1],a[o+2],a[o+3]):null;if(r){a.splice(o,4,...r);if(o===4){const x0=Math.round(a[0]),y0=Math.round(a[1]),x1=Math.round(a[0]+a[2]),y1=Math.round(a[1]+a[3]);a[0]=x0;a[1]=y0;a[2]=Math.max(1,x1-x0);a[3]=Math.max(1,y1-y0)}}return _di(im,...a)};
ctx.rect=(x,y,w,h)=>{const r=snapR(x,y,w,h);return r?_rc(...r):_rc(x,y,w,h)};
let IMGS=[],LINES=[],CH=[],PRX=null,OV=.6,W=1,H_=1,DPR=1,L={},GL=[],GI=[],WC=null,WI=null,F=0,TH={bg:'#000',fg:'#fff'};

 const ch=n.bg!==TH.bg||n.fg!==TH.fg;TH=n;return ch}

let CK='',CV=[];

// Jeder Buchstabe wird einmal als Glyphen-Bitmap gerendert und füllt seine Rasterzelle vollständig aus
let XO=null; // Export-Auflösung [w,h] oder null
const lineList=()=>S.tm===1?S.lines:S.tm===3?Array.from({length:cl(+$('#rp').value|0,1,40)},(_,i)=>S.lines[i%S.lines.length]):[S.lines[S.tm===2?S.line%S.lines.length:0]];
function fitStage(){const st=$('#stage').getBoundingClientRect(),r=(+$('#ew').value||1920)/(+$('#eh').value||1080),aw=Math.max(40,st.width-32),ah=Math.max(40,st.height-84),w=Math.min(aw,ah*r),h=w/r;cv.style.width=w+'px';cv.style.height=h+'px';cv.style.left=(st.width-w)/2+'px';cv.style.top=(40+(ah-h)/2)+'px'}
function rebuild(){
 try{

  const r=cv.getBoundingClientRect();DPR=XO?1:Math.min(devicePixelRatio||1,2);W=XO?XO[0]:Math.max(2,r.width|0);H_=XO?XO[1]:Math.max(2,r.height|0);cv.width=W*DPR;cv.height=H_*DPR;readTheme();buildGlyphs();
 }catch(e){err(e)}
}
function buildGlyphs(){
 try{
  const T=Math.PI*2,uu=(S.t/P.loop)%1,sc=W/Math.max(1,+$('#ew').value||W),amp=(+$('#px').value||0)*sc,dl=+$('#pd').value||0,fmv=+$('#fm').value,pp=$('#pp').checked,fnt=`${FONTS[F][1]} 200px '${FONTS[F][0]}',Impact,sans-serif`;

  const o0=document.createElement('canvas').getContext('2d');o0.font=fnt;const rm=o0.measureText('HÅg'),RA=rm.actualBoundingBoxAscent,RD=rm.actualBoundingBoxDescent;
  LINES=ls.map((tx,li)=>{
   const chars=[...tx.toUpperCase()],n=Math.max(1,chars.length),Lx={n,x0:W*P.mx/100,w:W*(1-2*P.mx/100),y0:(vc?(H_-(bh*nl+gap*(nl-1)))/2:H_*P.my/100)+li*(bh+gap),h:bh,i:li};
