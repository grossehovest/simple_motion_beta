<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Simple Motion</title>
<style>:root{--ui:#f2f2f7;--card:#fff;--fill:rgba(120,120,128,.12);--lab:#000;--mut:rgba(60,60,67,.6);color-scheme:light}@media(prefers-color-scheme:dark){:root{--ui:#000;--card:#1c1c1e;--fill:rgba(120,120,128,.24);--lab:#fff;--mut:rgba(235,235,245,.6);color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:var(--ui);color:var(--lab);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
form{width:min(340px,88vw);padding:32px 26px 26px;background:var(--card);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.14);text-align:center}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 4px}p{margin:0 0 20px;color:var(--mut);font-size:14px}
input{width:100%;padding:12px 14px;border:0;border-radius:12px;background:var(--fill);font:inherit;color:inherit;text-align:center;outline:0}input:focus{box-shadow:0 0 0 2px var(--card),0 0 0 4px #0000ff}
button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:#0000ff;color:#fff;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.5}
#m{min-height:20px;margin-top:12px;color:#ff3b30;font-size:13px}.s{animation:s .35s}@keyframes s{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}</style></head>
<body><form id="f"><h1>Simple Motion</h1><p>Enter password to continue</p><input id="p" type="password" placeholder="Password" autocomplete="current-password" autofocus><button id="b">Unlock</button><div id="m"></div></form>
